name: Release

# Triggered automatically on version tag push — builds and uploads the artifactbundle.
# Can also be triggered manually to do a dry-run build without publishing anything.
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only (no release upload)'
        required: false
        default: 'true'
        type: boolean

jobs:
  # Build natively on each architecture.
  # macOS: both arm64 and x86_64 (via Rosetta on macos-15).
  # Linux: x86_64 and aarch64 via ubuntu runners.
  # Windows: not yet supported (Swift on Windows lacks stable macro plugin support).
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: macos-x86_64
            build_cmd: arch -x86_64 swift build -c release
            find_bin: find .build -path "*x86_64*" -name "PySwiftGenerators-tool" -type f -perm +111
          - os: macos-15
            artifact: macos-arm64
            build_cmd: swift build -c release
            find_bin: find .build -path "*arm64*" -name "PySwiftGenerators-tool" -type f -perm +111
          # Linux and Windows: uncomment when ready
          # - os: ubuntu-latest
          #   artifact: linux-x86_64
          #   build_cmd: swift build -c release
          #   find_bin: find .build -name "PySwiftGenerators-tool" -type f
          # - os: ubuntu-24.04-arm
          #   artifact: linux-aarch64
          #   build_cmd: swift build -c release
          #   find_bin: find .build -name "PySwiftGenerators-tool" -type f

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Build release binary
        run: ${{ matrix.build_cmd }}

      - name: Locate and stage binary
        run: |
          BIN=$(${{ matrix.find_bin }} | head -1)
          echo "Found binary at: $BIN"
          cp "$BIN" PySwiftGenerators-${{ matrix.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artifact }}
          path: PySwiftGenerators-${{ matrix.artifact }}

  # Combine all binaries, package the artifactbundle, and attach to the release.
  package:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: /tmp/bins
          merge-multiple: true

      - name: Create artifactbundle
        run: |
          chmod +x /tmp/bins/PySwiftGenerators-macos-x86_64 \
                   /tmp/bins/PySwiftGenerators-macos-arm64

          BUNDLE=PySwiftGenerators.artifactbundle

          # macOS: lipo into a universal binary
          mkdir -p "$BUNDLE/macos/bin"
          lipo -create \
            /tmp/bins/PySwiftGenerators-macos-x86_64 \
            /tmp/bins/PySwiftGenerators-macos-arm64 \
            -output "$BUNDLE/macos/bin/PySwiftGenerators-tool"

          # Linux x86_64 (uncomment when linux jobs are enabled)
          # mkdir -p "$BUNDLE/linux-x86_64/bin"
          # cp /tmp/bins/PySwiftGenerators-linux-x86_64 \
          #    "$BUNDLE/linux-x86_64/bin/PySwiftGenerators-tool"
          # chmod +x "$BUNDLE/linux-x86_64/bin/PySwiftGenerators-tool"

          # Linux aarch64 (uncomment when linux jobs are enabled)
          # mkdir -p "$BUNDLE/linux-aarch64/bin"
          # cp /tmp/bins/PySwiftGenerators-linux-aarch64 \
          #    "$BUNDLE/linux-aarch64/bin/PySwiftGenerators-tool"
          # chmod +x "$BUNDLE/linux-aarch64/bin/PySwiftGenerators-tool"

          VERSION="${{ github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == refs/* ]]; then VERSION="0.0.1"; fi

          cat > "$BUNDLE/info.json" << JSON
          {
            "schemaVersion": "1.0",
            "artifacts": {
              "PySwiftGeneratorsBinary": {
                "type": "executable",
                "version": "${VERSION}",
                "variants": [
                  {
                    "path": "macos/bin/PySwiftGenerators-tool",
                    "supportedTriples": ["arm64-apple-macosx", "x86_64-apple-macosx"]
                  }
                ]
              }
            }
          }
          JSON

          zip -r "$BUNDLE.zip" "$BUNDLE"

          CHECKSUM=$(swift package compute-checksum "$BUNDLE.zip")
          echo "BUNDLE_CHECKSUM=${CHECKSUM}" >> "$GITHUB_ENV"
          echo "BUNDLE_VERSION=${VERSION}" >> "$GITHUB_ENV"

          # Write checksum + binaryTarget snippet into a file used as release body
          cat > release_notes.md << NOTES
          ## PySwiftGenerators ${VERSION}

          Prebuilt macro plugin binary for macOS (universal), Linux x86_64 and Linux aarch64.

          ### Add to Package.swift

          \`\`\`swift
          .binaryTarget(
              name: "PySwiftGenerators",
              url: "https://github.com/Py-Swift/PySwiftGenerators/releases/download/${VERSION}/PySwiftGenerators.artifactbundle.zip",
              checksum: "${CHECKSUM}"
          )
          \`\`\`
          NOTES

          # Also echo to Actions step summary
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifactbundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PySwiftGenerators.artifactbundle.zip
          body_path: release_notes.md
          fail_on_unmatched_files: true

